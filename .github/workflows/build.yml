name: Compilar y probar

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # necesario para publicar Releases

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurar
        run: dotnet restore PdfGestor.sln

      - name: Compilar
        run: dotnet build PdfGestor.sln -c Release --no-restore

      - name: Tests
        run: dotnet test PdfGestor.sln -c Release --no-build --verbosity normal

      - name: Publicar ejecutables (un solo .exe, sin instalar .NET)
        run: |
          dotnet publish src/PdfGestor.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/app
          dotnet publish src/PdfGestor.Cli -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish/cli

      - uses: actions/upload-artifact@v4
        with:
          name: PdfGestor-win-x64
          path: |
            publish/app/PdfGestor.exe
            publish/cli/pdfgestor-cli.exe

      # La versión sale de Directory.Build.props. Cada subida a main
      # crea (o actualiza) la Release de esa versión con los .exe.
      - name: Leer versión
        id: version
        shell: pwsh
        run: |
          $v = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          "tag=v$v" >> $env:GITHUB_OUTPUT

      - name: Crear Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: PDF Gestor ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.version.outputs.tag }}
          overwrite_files: true
          files: |
            publish/app/PdfGestor.exe
            publish/cli/pdfgestor-cli.exe
