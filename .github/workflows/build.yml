name: Compilar y probar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # necesario para publicar Releases
  actions: read   # SignPath lee el artefacto subido

jobs:
  build:
    runs-on: windows-latest

    env:
      # La firma solo se activa cuando existe el secreto de SignPath.
      SIGNPATH_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurar
        run: dotnet restore PdfGestor.sln

      - name: Compilar
        run: dotnet build PdfGestor.sln -c Release --no-restore

      - name: Tests
        run: dotnet test PdfGestor.sln -c Release --no-build --verbosity normal

      - name: Publicar ejecutables (un solo .exe, sin instalar .NET)
        shell: bash
        run: |
          dotnet publish src/PdfGestor.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/app
          dotnet publish src/PdfGestor.Cli -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish/cli
          mkdir -p publish/unsigned
          cp publish/app/PdfGestor.exe publish/cli/pdfgestor-cli.exe publish/unsigned/

      - name: Subir ejecutables sin firmar
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: PdfGestor-win-x64
          path: publish/unsigned/*

      # ── ¿Hay que publicar una versión nueva? ──
      # La versión sale de Directory.Build.props. Solo se crea una Release
      # cuando esa versión todavía no existe: para sacar una nueva, sube el número.
      - name: Comprobar versión
        id: version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La versión v$v ya está publicada; no se crea Release."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      # ── Firma con SignPath (gratis para código abierto) ──
      - name: Firmar con SignPath
        if: steps.version.outputs.new == 'true' && env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'pdfgestor' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600 # da tiempo a aprobarla a mano
          output-artifact-directory: publish/signed

      - name: Crear Release
        if: steps.version.outputs.new == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          dir=publish/unsigned
          extra=""
          if [ -f publish/signed/PdfGestor.exe ]; then
            dir=publish/signed
            extra=$'\n\nFree code signing provided by [SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org).'
          fi
          gh release create "$TAG" "$dir/PdfGestor.exe" "$dir/pdfgestor-cli.exe" \
            --target "$GITHUB_SHA" \
            --title "PDF Gestor $TAG" \
            --notes "Descarga **PdfGestor.exe** (aplicación con ventana) o **pdfgestor-cli.exe** (consola). No necesitan instalación y todo se procesa en tu equipo.$extra"
