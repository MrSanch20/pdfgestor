name: Compilar y probar

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # necesario para publicar Releases

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurar
        run: dotnet restore PdfGestor.sln

      - name: Compilar
        run: dotnet build PdfGestor.sln -c Release --no-restore

      - name: Tests
        run: dotnet test PdfGestor.sln -c Release --no-build --verbosity normal

      - name: Publicar ejecutables (un solo .exe, sin instalar .NET)
        run: |
          dotnet publish src/PdfGestor.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/app
          dotnet publish src/PdfGestor.Cli -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish/cli

      - uses: actions/upload-artifact@v4
        with:
          name: PdfGestor-win-x64
          path: |
            publish/app/PdfGestor.exe
            publish/cli/pdfgestor-cli.exe

      # La versión sale de Directory.Build.props. Cada subida a main
      # crea (o actualiza) la Release de esa versión con los .exe.
      - name: Leer versión
        id: version
        shell: pwsh
        run: |
          $v = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          "tag=v$v" >> $env:GITHUB_OUTPUT

      - name: Crear Release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.version.outputs.tag }}
        run: |
          # Borra la Release anterior de esta versión (si la hay) para dejarla limpia
          for id in $(gh api "repos/$REPO/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id"); do
            gh api -X DELETE "repos/$REPO/releases/$id"
          done
          # En subidas a main, mueve el tag de la versión al commit actual
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            gh api -X DELETE "repos/$REPO/git/refs/tags/$TAG" 2>/dev/null || true
          fi
          gh release create "$TAG" publish/app/PdfGestor.exe publish/cli/pdfgestor-cli.exe \
            --target "$GITHUB_SHA" \
            --title "PDF Gestor $TAG" \
            --notes "Descarga **PdfGestor.exe** (aplicación con ventana) o **pdfgestor-cli.exe** (consola). No necesitan instalación. Todo se procesa en tu equipo."
